[package]
name = "bckgrnd-msc-engine"
version = "0.1.0"
edition = "2021"
description = "Real-time DSP engine for the bckgrnd-msc stem machine: sample-accurate sequencer, subtractive voices, per-stem ducking, tempo-synced delay."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"