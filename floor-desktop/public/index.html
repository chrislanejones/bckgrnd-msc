<!DOCTYPE html>
<!--
  The static shell.

  `resources/views/app.blade.php` serves the same document when PHP is available; this
  is the copy used when the frontend is deployed on its own, with no Laravel in the
  request path. The two must stay in step — the only difference is the Blade
  interpolation of `window.__FLOOR__`.
-->
<html lang="en" class="antialiased">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FLOOR</title>
    <meta name="description" content="An EDM instrumental split into stems. Cut any part — the rest keeps playing.">
    <meta name="theme-color" content="#090a0c">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/build/assets/app.css">
    <script>window.__FLOOR__ = null;</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/build/assets/app.js"></script>
</body>
</html>
