<!DOCTYPE html>
<!--
  The static shell.

  `resources/views/app.blade.php` serves the same document when PHP is available; this
  is the copy used when the frontend is deployed on its own, with no Laravel in the
  request path. The two must stay in step — the only difference is the Blade
  interpolation of `window.__BCKGRND__`.
-->
<html lang="en" class="antialiased">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bckgrnd-msc</title>
    <meta name="description" content="An EDM instrumental split into stems. Cut any part — the rest keeps playing.">
    <meta name="theme-color" content="#090a0c">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/build/assets/app.css">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/build/assets/app.js"></script>
</body>
</html>
